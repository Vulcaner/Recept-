<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptář</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Receptář</h1>

    <form id="formular" action="#" method="post">
        
        <div style="border: 1px solid black;">
            <h2>Vložení nového receptu:</h2>
            <div id="zalozeni_receptu_wrapper">
                <div class="image-preview-placeholder">
                    Zatím není vložen žádný obrázek
                </div>
                
                <div id="zalozeni_receptu">
                    <input class="nazev_receptu_input" type="text" name="nazev_receptu" placeholder="Název receptu" required>

                    <div class="pair">
                        <label for="doba_pripravy">Čas přípravy:</label>
                        <select id="doba_pripravy" name="doba_pripravy">
                            <option value="1">1 minuta</option>
                            <option value="2">2 minuty</option>
                            <option value="5">5 minut</option>
                            <option value="10">10 minut</option>
                            <option value="15">15 minut</option>
                            <option value="30">30 minut</option>
                            <option value="45">45 minut</option>
                            <option value="60">1 hodina</option>
                            <option value="75">1 hodina 15 minut</option>
                            <option value="90">1 hodina 30 minut</option>
                            <option value="105">1 hodina 45 minut</option>
                            <option value="120">2 hodiny</option>
                            <option value="135">2 hodiny 15 minut</option>
                            <option value="150">2 hodiny 30 minut</option>
                            <option value="165">2 hodiny 45 minut</option>
                            <option value="180">3 hodiny</option>
                            <option value="195">3 hodiny 15 minut</option>
                            <option value="210">3 hodiny 30 minut</option>
                            <option value="225">3 hodiny 45 minut</option>
                            <option value="240">4 hodiny</option>
                        </select>
                    </div>

                    <div class="pair">
                        <label for="denni_dobro">Denní zařazení:</label>
                        <select id="denni_dobro" name="denni_dobro">
                            <option value="snidane">Snídaně</option>
                            <option value="svacina">Svačina</option>
                            <option value="obed">Oběd</option>
                            <option value="vecere">Večeře</option>
                        </select>
                    </div>

                    <div class="pair">
                        <label for="druh_kuchyne">Druh kuchyně:</label>
                        <select id="druh_kuchyne" name="druh_kuchyne">
                            <option value="ceska">Česká</option>
                            <option value="indicka">Indická</option>
                            <option value="asijska">Asijská</option>
                            <option value="francouzska">Francouzská</option>
                        </select>
                    </div>

                    <div class="pair">
                        <label for="typ_jidla">Typ jídla:</label>
                        <select id="typ_jidla" name="typ_jidla">
                            <option value="polevka">Polévka</option>
                            <option value="maso">Maso</option>
                            <option value="omacka">Omáčka</option>
                            <option value="testoviny">Těstoviny</option>
                            <option value="moucnik">Moučníky</option>
                            <option value="dezert">Dezerty</option>
                        </select>
                    </div>

                    <button class="upload-button" type="button" onclick="document.getElementById('upload_foto').click()">Nahrát obrázek</button>
                    <input id="upload_foto" type="file" name="foto" accept=".jpg, .png, .jpeg" style="display: none;">
                    <p id="max_vel">Maximální velikost fotografie je 2MB a podporované formáty jsou JPG, JPEG nebo PNG.</p>
                </div>
            </div>
        </div>
        
        <div style="border: 1px solid black;">
            <h2>Přidání ingrediencí</h2>
            <div id="ingredience-container">
                <div class="skupina-ingredienci">
                    <div class="group-header">
                        <input type="text" name="skupina_ingredienci" placeholder="Skupina ingrediencí (hlavní jídlo, příloha, omáčka, ...)" value="">
                        <div class="krizek-group" title="Smazat">
                            <img src="obrazky/kriz.png" alt="Smazat skupinu">
                        </div>
                    </div>
                    
                    <div class="ingredient-line">
                        <input type="text" name="nazev_ingredience" placeholder="Název">
                        <input type="number" name="mnozstvi" placeholder="Množství" min="1">
                        <select name="mnozstvi_id">
                            <option>ks</option>
                            <option>g</option>
                            <option>kg</option>
                            <option>ml</option>
                            <option>l</option>
                            <option>balení</option>
                            <option>balíček</option>
                            <option>hrnek</option>
                            <option>špetka</option>
                            <option>stroužek</option>
                        </select>
                        <div class="krizek" title="Smazat">
                            <img src="obrazky/kriz.png" alt="Smazat">
                        </div>
                    </div>
        
                    <div class="div-pridani-group">
                        <button class="pridej-ingredienci-group" type="button">Přidej ingredienci</button>
                    </div>
                </div>
            </div>
        
            <div class="div-pridani">
                <button id="pridej-skupinu-ingredienci" type="button">Přidej skupinu ingrediencí</button>
            </div>       
        </div>
          
        <div style="border: 1px solid black;">
            <h2>Postup přípravy receptu</h2>
            <div>
                <ul>
                    <li>
                        <textarea id="postup_area" type="text" name="postup" placeholder="Popis přípravy" required="required" rows="10" cols="100"></textarea>
                    </li>
                </ul>
            </div>
        </div>

        <div class="button-container">
            <a href="recepty.html"><input id="zobraz_ulozene" type="button" value="Zobrazit uložené recepty"></a>
            <input id="uloz_recept" type="submit" value="Uložit recept">
        </div>

    </form>
    
    <script src="JS/databaze.js"></script>
    <script src="JS/model.js"></script>
    <script src="JS/view.js"></script>
    <script src="JS/controller.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const model = new Model();
            const view = new View();
            const controller = new Controller(model, view);
        });
    </script>

</body>
</html>
