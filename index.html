<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptář</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Receptář</h1>

    <form action="/submit_form" method="post">
        <div style="border: 1px solid black;">
        <h2>Vložení nového receptu:</h2>
            <div>
        <input type="text" name="nazev_receptu" placeholder="Název receptu">
        <input type="number" name="doba_pripravy" placeholder="Čas přípravy" min="1">
        <input id="upload_foto" type="file" name="foto" accept=".jpg, .png">
        <label for="upload_foto">Nahrát fotografii</label>
        <p>Maximální velikost fotografie je 2MB a podporované formáty jsou JPG nebo PNG.</p>
            </div>
        </div>

        <div style="border: 1px solid black;">
            <h2>Přidání ingrediencí</h2>
            <div>
                <input type="text" name="skupina_ingredienci" placeholder="Skupina ingrediencí (např. hlavní chod, omáčka, příloha atd.)">
                <ul>
                    <li data-set="0" > <!-- Zde budou možnosti přidání dalších ingrediencí pomocí + tlačítka -->
                        <input type="text" name="nazev_ingredience" placeholder="Název">
                        <input type="number" name="mnozstvi" placeholder="Množství" min="1">
                        <select name="mnozstvi_id">Jednotky
                            <option>ks</option>
                            <option>g</option>
                            <option>kg</option>
                            <option>ml</option>
                            <option>l</option>
                            <option>balení</option>
                            <option>balíček</option>
                            <option>hrnek</option>
                            <option>špetka</option>
                            <option>stroužek</option>
                        </select>
                        <div title="Smazat">Křížek na smazání</div>
                    </li>
                </ul>
                <div>Přidat ingredienci</div>
                <div>Přidat skupinu ingrediencí</div>
            </div>
        </div>

        <div style="border: 1px solid black;">
            <h2>Postup přípravy receptu</h2>
            <div>
                <ul>
                    <li>
                        <textarea type ="text" name="postup" placeholder="Popis přípravy"></textarea>
                    </li>
                    <div>Smazat krok postupu</div>
                </ul>
                <div>Přidat krok postupu</div>
            </div>
        </div>

        <div>
            <input type="submit" value="Uložit recept">
        </div>

    </form>
    

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
